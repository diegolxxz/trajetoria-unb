<!DOCTYPE html>
<html lang="pt-BR" data-tema="escuro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="app-root" content="../">
    <meta name="description" content="Calcule seu IRA e sua média ponderada por período com TrajetoriaUNB.">
    <title>Calculadora IRA e MP — TrajetoriaUNB</title>
    <link rel="icon" href="../favicon.ico" sizes="any">
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/intercambio.css">
</head>
<body >
    <header class="cabecalho">
        <div class="container topo-site">
            <a class="marca-site" href="../ira/">Trajetoria<span class="badge-unb">UNB</span></a>
            <nav aria-label="Navegação principal">
                <a href="../ira/" aria-current="page">Calculadora IRA e MP</a>
                <a href="../intercambio/" >Intercâmbio</a>
            </nav>
            <button id="btnTema" class="btn-tema" type="button" aria-label="Ativar tema claro">☀️</button>
        </div>
    </header>
    <main class="container pagina-conteudo">
        <p id="avisoPersistencia" class="aviso" role="status" hidden></p>
        <div class="intro-pagina"><h1>Calculadora IRA e MP</h1></div>
        <div class="barra-superior">
            <button class="btn btn-success btn-novo-periodo" onclick="criarPeriodo()">+ Novo período</button>
            <div id="ira-mp" class="badge-resultado" aria-live="polite">IRA: 0,0000 · MP: 0,0000</div>
        </div>
        <div id="periodos"></div>
        <p class="texto-apoio">Módulo livre: entra no IRA, mas não na MP. Cada crédito equivale a 15 horas.</p>
    </main>
    <footer class="text-center py-4"><div class="container">Projeto independente, sem vínculo oficial com a UnB. Confira seus dados no SIGAA.</div></footer>
    <script src="../js/calculos.js"></script>
    <script src="../js/common.js"></script>
    <script src="../js/functionality.js"></script>
</body>
</html>
