name: Verificações

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend e publicação
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.12'
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: bun run build:verified
      - uses: actions/upload-artifact@v4
        with:
          name: site-estatico
          path: dist/
          retention-days: 7

  python_lint:
    name: Lint e formatação Python
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.17'
          python-version: '3.13'
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  python_tests:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: ubuntu-latest
            python: '3.13'
          - os: windows-latest
            python: '3.13'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.17'
          python-version: ${{ matrix.python }}
      - run: uv sync --frozen
      - run: uv run pytest

  required:
    name: Verificações obrigatórias
    if: always()
    needs: [frontend, python_lint, python_tests]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Conferir todos os resultados
        env:
          FRONTEND: ${{ needs.frontend.result }}
          PYTHON_LINT: ${{ needs.python_lint.result }}
          PYTHON_TESTS: ${{ needs.python_tests.result }}
        run: test "$FRONTEND" = success && test "$PYTHON_LINT" = success && test "$PYTHON_TESTS" = success
