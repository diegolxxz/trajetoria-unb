<!doctype html>
<html lang="pt-BR" data-tema="escuro">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
        />
        <meta name="theme-color" content="#1b1d21" />
        <script>
            try {
                document.documentElement.dataset.tema = localStorage.getItem('calculadora-ira-tema') || 'escuro';
            } catch {}
        </script>
        <meta name="app-root" content="../" />
        <meta name="description" content="Calcule seu IRA e sua média ponderada por período com Trajetória Unb." />
        <title>Calculadora IRA e MP | Trajetória Unb</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
        <link rel="stylesheet" href="../css/style.css" />
        <link rel="stylesheet" href="../css/intercambio.css" />
        <link rel="stylesheet" href="../css/interface.css" />
        <link rel="canonical" href="https://trajetoriaunb.vercel.app/ira/" />
        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="Trajetória Unb" />
        <meta property="og:title" content="Calculadora IRA e MP | Trajetória Unb" />
        <meta
            property="og:description"
            content="Calcule seu IRA e sua média ponderada por período com Trajetória Unb."
        />
        <meta property="og:url" content="https://trajetoriaunb.vercel.app/ira/" />
        <link rel="icon" href="../favicon.ico" sizes="16x16 32x32 48x48 64x64 128x128 256x256" />
        <link rel="icon" href="../favicon.svg" type="image/svg+xml" sizes="any" />
        <link rel="icon" href="../favicon-96x96.png" type="image/png" sizes="96x96" />
        <link rel="apple-touch-icon" href="../apple-touch-icon.png" sizes="180x180" />
        <link rel="manifest" href="../site.webmanifest" />
    </head>
    <body class="interface-unb pagina-ira">
        <header class="cabecalho">
            <div class="container topo-site">
                <a class="marca-site" href="../">Trajetória<span class="badge-unb">Unb</span></a>
                <div id="ira-mp" class="badge-resultado" aria-live="polite"><span>IRA: 0</span><span>MP: 0</span></div>
                <nav aria-label="Navegação principal">
                    <a href="../ira/" aria-current="page"
                        ><span class="nav-ira-completo">Calculadora IRA e MP</span
                        ><span class="nav-ira-curto">IRA e MP</span></a
                    >
                    <a href="../intercambio/">Intercâmbio</a>
                    <a href="../turmas/">Turmas</a>
                </nav>
            </div>
        </header>
        <main class="container pagina-conteudo">
            <p id="avisoPersistencia" class="aviso" role="status" hidden></p>
            <div class="ira-abertura">
                <h1>Calculadora IRA e MP</h1>
                <div class="ira-ferramentas">
                    <button type="button" class="btn btn-success btn-novo-periodo" onclick="criarPeriodo()">
                        + Novo período
                    </button>

                    <fieldset class="modo-tabela">
                        <legend class="visually-hidden">Exibição da calculadora</legend>
                        <label
                            ><input type="radio" name="visualizacaoIra" value="expandido" checked /><span
                                >Detalhado</span
                            ></label
                        ><label
                            ><input type="radio" name="visualizacaoIra" value="compacto" /><span>Resumido</span></label
                        >
                    </fieldset>
                </div>
            </div>
            <div id="periodos"></div>
            <div class="ira-acoes-finais">
                <button type="button" class="btn btn-novo-periodo" onclick="criarPeriodo()">+ Novo período</button>
            </div>
            <p class="texto-apoio">Módulo livre: entra no IRA, mas não na MP.</p>
        </main>
        <footer class="text-center py-4">
            <div class="container">
                Projeto independente, sem vínculo oficial com a Unb. Confira seus dados no SIGAA.
            </div>
        </footer>
        <script src="../js/calculos.js?v=2"></script>
        <script src="../js/common.js"></script>
        <script src="../js/functionality.js?v=4"></script>
    </body>
</html>
