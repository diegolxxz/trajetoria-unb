[project]
name = "trajetoria-unb"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "bottle>=0.13,<0.14",
    "beautifulsoup4>=4.12,<5",
    "pypdf>=5,<7",
    "pdfplumber>=0.11,<0.12",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.14,<1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["dist", ".playwright-mcp"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
